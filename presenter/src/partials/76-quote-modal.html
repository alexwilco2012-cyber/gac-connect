  <!-- Quote modal (live dashboards, 23 Sep; spec §3): "Quote: {service}" from
       the supplier view's inbox, the site's dashboard/supplier/QuoteModal.tsx.
       Price in whole pounds, lead time, validity and an optional note; the
       quote is stored against the request (pres.desk.quotes) and the row and
       the pipeline counters move. Nothing is sent anywhere: the toast says so.
       role="dialog" + aria-modal sit on the panel, so the core's
       componentDidUpdate focuses the price and hands focus back on close;
       Escape closes it through features/supplier-desk.js escape(). -->
  <sc-if value="{{ sdQuoteOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(10,37,64,.45);display:grid;place-items:center;z-index:91;padding:16px;" sc-camel-on-click="{{ sdQuoteOverlay }}">
      <div role="dialog" aria-modal="true" aria-labelledby="sd-quote-title" style="background:#FFFFFF;border-radius:14px;max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;padding:24px;box-sizing:border-box;box-shadow:0 1px 3px rgba(10,37,64,.07);">
        <form sc-camel-no-validate="{{ true }}" sc-camel-on-submit="{{ sdQuoteSubmit }}">
          <div style="padding-right:4px;">
            <p style="margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E5E8A;">{{ sdQuoteEyebrow }}</p>
            <h2 id="sd-quote-title" style="margin:4px 0 0;font-family:'Space Grotesk',sans-serif;font-size:19px;line-height:1.375;font-weight:700;color:#0A2540;">{{ sdQuoteTitle }}</h2>
            <div style="margin-top:6px;font-size:13px;color:#33475F;">
              <p style="margin:0;">{{ sdQuoteLede }}</p>
              <p style="margin:8px 0 0;"><span style="{{ sdQuotePillStyle }}">{{ sdQuotePill }}</span></p>
            </div>
          </div>

          <div style="margin-top:20px;display:grid;gap:16px;">
            <div>
              <label for="sd-quote-price" style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Price (£)</label>
              <div style="position:relative;">
                <span aria-hidden="true" style="pointer-events:none;position:absolute;top:50%;left:12px;margin-top:2px;transform:translateY(-50%);font-size:13.5px;font-weight:700;color:#33475F;">£</span>
                <input id="sd-quote-price" type="text" sc-camel-input-mode="numeric" sc-camel-auto-complete="off" value="{{ sdQuotePrice }}" sc-camel-on-change="{{ sdOnPrice }}" aria-invalid="{{ sdQuotePriceInvalid }}" aria-describedby="sd-quote-price-help" style="margin-top:4px;display:block;min-height:44px;width:100%;box-sizing:border-box;border-radius:8px;border:1.5px solid {{ sdQuotePriceBorder }};background:#FFFFFF;padding:8px 10px 8px 28px;font-size:13.5px;font-weight:600;color:#0A2540;font-family:inherit;font-variant-numeric:tabular-nums;" style-focus="border-color:#0E5E8A !important;">
              </div>
              <p id="sd-quote-price-help" style="margin:4px 0 0;font-size:12px;color:#33475F;">Whole pounds — the figure the client sees in the comparison.</p>
            </div>

            <div class="gac-sd-grid2" style="display:grid;grid-template-columns:minmax(0,1fr);gap:16px;">
              <div>
                <label for="sd-quote-lead" style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Lead time</label>
                <sc-raw-select id="sd-quote-lead" value="{{ sdQuoteLead }}" sc-camel-on-change="{{ sdOnLead }}" style="margin-top:4px;display:block;min-height:44px;width:100%;box-sizing:border-box;border-radius:8px;border:1.5px solid #CBD6E2;background:#FFFFFF;padding:8px 10px;font-size:13.5px;font-weight:600;color:#0A2540;font-family:inherit;" style-focus="border-color:#0E5E8A !important;">
                  <sc-for list="{{ sdLeadOptions }}" as="o" hint-placeholder-count="4"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
                </sc-raw-select>
              </div>
              <div>
                <label for="sd-quote-valid" style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Valid for</label>
                <sc-raw-select id="sd-quote-valid" value="{{ sdQuoteValid }}" sc-camel-on-change="{{ sdOnValid }}" style="margin-top:4px;display:block;min-height:44px;width:100%;box-sizing:border-box;border-radius:8px;border:1.5px solid #CBD6E2;background:#FFFFFF;padding:8px 10px;font-size:13.5px;font-weight:600;color:#0A2540;font-family:inherit;" style-focus="border-color:#0E5E8A !important;">
                  <sc-for list="{{ sdValidOptions }}" as="o" hint-placeholder-count="3"><option value="{{ o.value }}">{{ o.label }}</option></sc-for>
                </sc-raw-select>
              </div>
            </div>

            <div>
              <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;">
                <label for="sd-quote-note" style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Note to the client <span style="font-weight:400;">(optional)</span></label>
                <span id="sd-quote-note-count" style="font-size:11.5px;color:#33475F;font-variant-numeric:tabular-nums;"><span aria-hidden="true">{{ sdQuoteNoteCount }}</span><span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">{{ sdQuoteNoteSr }}</span></span>
              </div>
              <textarea id="sd-quote-note" rows="3" sc-camel-max-length="280" value="{{ sdQuoteNote }}" sc-camel-on-change="{{ sdOnNote }}" aria-describedby="sd-quote-note-count" style="margin-top:4px;display:block;min-height:84px;width:100%;box-sizing:border-box;border-radius:8px;border:1.5px solid #CBD6E2;background:#FFFFFF;padding:8px 10px;font-size:13.5px;line-height:1.375;font-weight:400;color:#0A2540;font-family:inherit;resize:vertical;" style-focus="border-color:#0E5E8A !important;"></textarea>
            </div>
          </div>

          <sc-if value="{{ sdQuoteProblem }}" hint-placeholder-val="{{ false }}">
            <p role="alert" style="margin:16px 0 0;border-radius:8px;border-left:4px solid #B45309;background:#FBF0E1;padding:8px 12px;font-size:12.5px;font-weight:600;color:#B45309;">{{ sdQuoteProblemText }}</p>
          </sc-if>

          <div style="margin-top:20px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:12px;">
            <button type="button" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-sizing:border-box;background:#FFFFFF;color:#0E5E8A;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;" style-hover="border-color:#0E5E8A !important;" sc-camel-on-click="{{ sdQuoteCancel }}">Cancel</button>
            <button type="submit" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;box-sizing:border-box;background:#0E5E8A;color:#FFFFFF;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;" style-hover="background:#0B4C70 !important;">{{ sdQuoteSendIcon }}Send quote</button>
          </div>
        </form>
      </div>
    </div>
  </sc-if>
