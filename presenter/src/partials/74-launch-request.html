  <sc-if value="{{ lrqOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(10,37,64,.45);display:grid;place-items:center;z-index:91;padding:16px;" sc-camel-on-click="{{ closeLrqOverlay }}">
      <div role="dialog" aria-modal="true" aria-label="{{ lrqTitle }}" aria-labelledby="launch-request-title" style="background:#FFFFFF;border-radius:14px;max-width:480px;width:94vw;max-height:calc(100dvh - 32px);overflow-y:auto;padding:24px;box-sizing:border-box;">
        <p style="font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0E5E8A;margin:0;">Launch request</p>
        <h2 id="launch-request-title" style="margin:4px 0 0;font-size:19px;">{{ lrqTitle }}</h2>
        <p style="color:#33475F;font-size:13px;margin:6px 0 0;" data-testid="launch-summary">{{ lrqSummary }}</p>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px;">
          <label style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Vessel
            <sc-raw-select value="{{ lrqVesselId }}" sc-camel-on-change="{{ onLrqVessel }}" data-testid="launch-vessel" style="display:block;margin-top:4px;min-height:40px;width:100%;box-sizing:border-box;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;background:#FFFFFF;font-family:inherit;color:#0A2540;">
              <sc-for list="{{ lrqVessels }}" as="v" hint-placeholder-count="3"><option value="{{ v.id }}">{{ v.label }}</option></sc-for>
            </sc-raw-select>
          </label>
          <label style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Passengers
            <input type="{{ 'number' }}" min="1" step="1" sc-camel-input-mode="numeric" value="{{ lrqPaxText }}" sc-camel-on-change="{{ onLrqPax }}" sc-camel-on-blur="{{ onLrqPaxBlur }}" data-testid="launch-passengers" aria-describedby="{{ lrqPaxDescribedBy }}" style="display:block;margin-top:4px;min-height:40px;width:100%;box-sizing:border-box;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;background:#FFFFFF;font-family:inherit;color:#0A2540;">
          </label>
        </div>
        <sc-if value="{{ lrqOverLimit }}" hint-placeholder-val="{{ false }}">
          <p id="launch-over-limit" style="border-left:4px solid #B45309;background:#FBF0E1;color:#B45309;border-radius:8px;padding:8px 12px;font-size:12.5px;margin:8px 0 0;" data-testid="over-limit">{{ lrqOverLimitText }}</p>
        </sc-if>

        <div style="border:1px solid #E5EAF1;border-radius:8px;background:#FAFBFD;padding:12px;margin-top:16px;" data-testid="launch-freight">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <span style="font-size:13px;font-weight:600;">Freight to go out?</span>
            <button type="button" role="switch" aria-checked="{{ lrqFreightAria }}" aria-label="Freight to go out" style="{{ lrqFreightTrack }}" sc-camel-on-click="{{ toggleLrqFreight }}"><span style="{{ lrqFreightKnob }}"></span></button>
          </div>
          <sc-if value="{{ lrqFreight }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:10px;">
              <label style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Freight detail
                <input type="text" value="{{ lrqFreightDetail }}" sc-camel-on-change="{{ onLrqFreightDetail }}" placeholder="e.g. 2 pallets stores, ~300 kg" data-testid="launch-freight-detail" style="display:block;margin-top:4px;min-height:40px;width:100%;box-sizing:border-box;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;background:#FFFFFF;font-family:inherit;color:#0A2540;">
              </label>
              <p style="font-size:12px;color:#33475F;margin:8px 0 0;" data-testid="launch-freight-note"><sc-if value="{{ !lrqFreightIncluded }}" hint-placeholder-val="{{ false }}"><strong style="color:#0A2540;">{{ lrqQuotedSeparately }}</strong> </sc-if>{{ lrqFreightNote }}</p>
            </div>
          </sc-if>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px;">
          <label style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">{{ lrqOutLabel }}
            <input type="text" value="{{ lrqOutTime }}" sc-camel-on-change="{{ onLrqOut }}" data-testid="launch-out" style="display:block;margin-top:4px;min-height:40px;width:100%;box-sizing:border-box;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;background:#FFFFFF;font-family:inherit;color:#0A2540;">
          </label>
          <label style="display:block;font-size:12.5px;font-weight:600;color:#33475F;">Return
            <input type="text" value="{{ lrqReturnTime }}" sc-camel-on-change="{{ onLrqReturn }}" data-testid="launch-return" style="display:block;margin-top:4px;min-height:40px;width:100%;box-sizing:border-box;border:1.5px solid #CBD6E2;border-radius:8px;padding:8px 10px;font-size:13.5px;font-weight:600;background:#FFFFFF;font-family:inherit;color:#0A2540;">
          </label>
        </div>

        <fieldset style="border:0;padding:0;margin:16px 0 0;min-width:0;">
          <legend style="font-size:12.5px;font-weight:600;color:#33475F;padding:0;">Reply-by deadline · set by you</legend>
          <div role="group" aria-label="Reply-by window" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">
            <sc-for list="{{ lrqWindows }}" as="w" hint-placeholder-count="6"><button type="button" style="{{ w.style }}" aria-pressed="{{ w.pressed }}" sc-camel-on-click="{{ w.on }}">{{ w.label }}</button></sc-for>
          </div>
          <p style="{{ lrqAdviceStyle }}" data-testid="deadline-advice" data-tone="{{ lrqAdviceTone }}">{{ lrqAdvice }}</p>
        </fieldset>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
          <button type="button" style="background:#FFFFFF;color:#0E5E8A;border:1.5px solid #CBD6E2;border-radius:8px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;" style-hover="border-color:#0E5E8A;" sc-camel-on-click="{{ closeLrq }}">Cancel</button>
          <button type="button" style="background:#0E5E8A;color:#FFFFFF;border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;" style-hover="background:#0B4C70;" sc-camel-on-click="{{ sendLrq }}" data-testid="launch-send">Send request</button>
        </div>
      </div>
    </div>
  </sc-if>
