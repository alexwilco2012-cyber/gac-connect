  <sc-if value="{{ tourOpen }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="Guided tour" style="position:fixed;bottom:26px;right:26px;z-index:95;background:#0A2540;color:#FFFFFF;border-radius:12px;padding:18px 20px;width:330px;max-width:88vw;box-shadow:0 8px 30px rgba(10,37,64,.35);">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="background:#FFC72C;color:#0A2540;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;border-radius:5px;padding:2px 7px;">{{ tourStepLabel }}</span>
        <strong style="font-size:14px;">{{ tourTitle }}</strong>
      </div>
      <p style="color:#B9C8D6;font-size:13px;margin:10px 0 14px;">{{ tourBody }}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button style="background:none;border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;" style-hover="border-color:#FFFFFF;" sc-camel-on-click="{{ skipTour }}">Skip</button>
        <sc-if value="{{ tourHasBack }}" hint-placeholder-val="{{ false }}">
          <button style="background:none;border:1.5px solid rgba(255,255,255,.35);color:#FFFFFF;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12.5px;cursor:pointer;" style-hover="border-color:#FFFFFF;" sc-camel-on-click="{{ tourBack }}">Back</button>
        </sc-if>
        <button style="background:#0E5E8A;color:#FFFFFF;border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12.5px;cursor:pointer;" style-hover="background:#0B4C70;" sc-camel-on-click="{{ tourNext }}">{{ tourNextLabel }}</button>
      </div>
    </div>
  </sc-if>
